# ==============================================================================
# CONFIGURACIÓN DE NGINX CON DUCKDNS Y GUNICORN - FITLIFE BACKEND (AWS EC2)
# Ruta en servidor: /etc/nginx/sites-available/fitlife
# ==============================================================================

server {
    listen 80;
    # Reemplaza 'fitlife-gym.duckdns.org' por tu subdominio creado en duckdns.org
    server_name fitlife-gym.duckdns.org www.fitlife-gym.duckdns.org;

    client_max_body_size 20M;

    # Archivos estáticos recolectados con collectstatic
    location /static/ {
        alias /home/ubuntu/fitlife-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy inverso hacia el socket Unix de Gunicorn
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/fitlife-backend/fitlife.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Páginas de error personalizadas
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
