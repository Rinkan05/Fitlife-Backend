{% extends 'base.html' %}

{% block title %}Iniciar Sesión - FitLife{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-badge-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2">Iniciar Sesión</h3>
                <p class="text-muted small">Ingresa tus credenciales para acceder a la plataforma</p>
            </div>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Nombre de usuario" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary fw-bold py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar a FitLife
                    </button>
                </div>
            </form>

            <div class="card-footer bg-transparent border-0 text-center small text-muted pt-0">
                <i class="bi bi-info-circle"></i> Los administradores pueden acceder directamente con su superusuario al <a href="/admin/">Django Admin</a>.
            </div>
        </div>
    </div>
</div>
{% endblock %}
